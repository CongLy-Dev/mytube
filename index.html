<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube - Tối ưu iPad 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f; /* Nền tối chuẩn YouTube */
            color: #f1f1f1;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Kỹ thuật hack tỷ lệ khung hình 16:9 cho Safari cũ không hỗ trợ aspect-ratio */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Khắc phục lỗi cuộn giật lag trên iOS 10 */
        .scroll-touch {
            -webkit-overflow-scrolling: touch;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }
        
        .scroll-touch::-webkit-scrollbar {
            display: none; /* Ẩn thanh cuộn trên Safari/Chrome */
        }

        /* Giới hạn số dòng cho tiêu đề video */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Lưới Flexbox an toàn cho Safari 10 */
        .yt-grid {
            display: flex;
            flex-wrap: wrap;
            margin: -8px;
        }
        .yt-grid-item {
            padding: 8px;
            width: 100%;
        }
        @media (min-width: 600px) {
            .yt-grid-item { width: 50%; }
        }
        @media (min-width: 900px) {
            .yt-grid-item { width: 33.3333%; }
        }

        /* Padding hack cho Aspect Ratio 16:9 hình ảnh */
        .aspect-16-9-img {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #272727;
            overflow: hidden;
        }
        .aspect-16-9-img img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Ẩn phần tử */
        .hidden-view {
            display: none !important;
        }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white w-full h-full">

    <!-- Modal Nhập API Key -->
    <div id="api-modal" class="fixed inset-0 z-[100] bg-black bg-opacity-80 flex items-center justify-center hidden-view">
        <div class="bg-[#272727] p-6 rounded-xl max-w-md w-full mx-4 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Cài đặt YouTube API Key</h2>
            <p class="text-sm text-gray-300 mb-4">Để tải video thật, vui lòng nhập khóa API YouTube Data v3 của bạn. Khóa này sẽ được lưu cục bộ trên trình duyệt iPad của bạn.</p>
            <input type="text" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-[#121212] border border-gray-600 rounded-lg px-4 py-2 text-white mb-4 focus:outline-none focus:border-blue-500">
            <div class="flex justify-end space-x-3">
                <button id="close-modal-btn" class="px-4 py-2 text-sm font-semibold hover:bg-[#3f3f3f] rounded-full hidden-view">Đóng</button>
                <button id="save-api-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 text-sm font-semibold rounded-full">Lưu & Khởi động</button>
            </div>
        </div>
    </div>

    <!-- Header Cố định -->
    <header class="flex items-center justify-between px-4 py-2 bg-[#0f0f0f] sticky top-0 z-50 border-b border-gray-800 h-14">
        <!-- Logo -->
        <div class="flex items-center space-x-4 cursor-pointer" id="logo-btn">
            <div class="flex items-center space-x-1">
                <svg viewBox="0 0 24 24" fill="#FF0000" class="w-8 h-8">
                    <path d="M21.582 6.186a2.506 2.506 0 00-1.762-1.766C18.265 4 12 4 12 4s-6.264 0-7.82.42a2.505 2.505 0 00-1.762 1.766C2 7.74 2 12 2 12s0 4.26.418 5.814a2.506 2.506 0 001.762 1.766C5.736 20 12 20 12 20s6.265 0 7.82-.42a2.506 2.506 0 001.762-1.766C22 16.26 22 12 22 12s0-4.26-.418-5.814zM9.99 15.474V8.526L15.918 12l-5.928 3.474z"></path>
                </svg>
                <span class="text-xl font-semibold tracking-tighter hidden sm:block" style="font-family: 'Arial', sans-serif;">YouTube</span>
            </div>
        </div>

        <!-- Thanh tìm kiếm -->
        <div class="flex-1 max-w-2xl mx-4 flex items-center">
            <div class="flex items-center w-full bg-[#121212] border border-gray-700 rounded-full overflow-hidden focus-within:border-blue-500">
                <input type="text" id="search-input" placeholder="Tìm kiếm" class="w-full bg-transparent px-4 py-2 text-white focus:outline-none text-sm md:text-base">
                <button id="search-btn" class="bg-[#222222] px-4 md:px-5 py-2 border-l border-gray-700 hover:bg-[#333333]">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 opacity-70">
                        <path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Công cụ bên phải -->
        <div class="flex items-center space-x-3">
            <button id="settings-btn" class="p-1 opacity-80 hover:opacity-100">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path d="M12 8.5c1.93 0 3.5 1.57 3.5 3.5s-1.57 3.5-3.5 3.5-3.5-1.57-3.5-3.5 1.57-3.5 3.5-3.5zM12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm7.36 4.07h1.49c-.19-1.99-1.07-3.76-2.39-5.18l-1.05 1.05c1.07 1.18 1.76 2.72 1.95 4.13zM6.65 6.94L5.6 5.89C4.28 7.31 3.4 9.08 3.21 11.07h1.49c.19-1.41.88-2.95 1.95-4.13zM20.8 12.93h-1.49c-.19 1.99-1.07 3.76-2.39 5.18l1.05 1.05c1.32-1.42 2.2-3.19 2.39-5.18h.44zm-14.15 0H5.16c.19 1.99 1.07 3.76 2.39 5.18l1.05-1.05c-1.07-1.18-1.76-2.72-1.95-4.13z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Trang chủ (Lưới Video) -->
    <main id="home-view" class="w-full max-w-7xl mx-auto p-4">
        <!-- Khu vực thông báo trạng thái -->
        <div id="status-message" class="text-center py-10 text-gray-400 hidden-view">
            Đang tải dữ liệu...
        </div>
        
        <!-- Grid chứa video -->
        <div id="video-grid" class="yt-grid">
            <!-- Dữ liệu sẽ được render bằng JS -->
        </div>
    </main>

    <!-- Trang Xem Video (Player) -->
    <main id="watch-view" class="w-full max-w-6xl mx-auto hidden-view flex flex-col lg:flex-row">
        <!-- Cột Trái: Trình phát và Thông tin -->
        <div class="w-full lg:w-[70%]">
            <div class="video-container sticky top-14 z-40 lg:relative lg:top-0 bg-black">
                <div id="youtube-player"></div>
            </div>

            <div class="p-4 border-b border-gray-800">
                <h1 id="watch-title" class="text-lg md:text-xl font-bold text-white mb-2">Đang tải...</h1>
                <div class="text-sm text-[#aaaaaa] mb-4 flex justify-between items-center">
                    <span id="watch-stats">... lượt xem</span>
                </div>

                <div class="flex items-center justify-between mb-4 flex-wrap">
                    <div class="flex items-center space-x-3 mb-2 md:mb-0">
                        <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center text-xl font-bold text-white">
                            <span id="watch-channel-avatar">C</span>
                        </div>
                        <div>
                            <div id="watch-channel-name" class="font-bold text-base text-white">Tên Kênh</div>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-2 scroll-touch overflow-x-auto whitespace-nowrap pb-1">
                        <div class="flex items-center bg-[#272727] rounded-full">
                            <button class="flex items-center space-x-2 px-4 py-2 hover:bg-[#3f3f3f] rounded-l-full border-r border-[#3f3f3f]">
                                <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"></path></svg>
                                <span class="text-sm font-semibold" id="watch-likes">Thích</span>
                            </button>
                            <button class="px-4 py-2 hover:bg-[#3f3f3f] rounded-r-full">
                                <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"></path></svg>
                            </button>
                        </div>
                        <button class="flex items-center space-x-2 bg-[#272727] px-4 py-2 rounded-full hover:bg-[#3f3f3f]">
                            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M11.7333 15.6667V12.3333C5.06667 12.3333 1.73333 17.3333 0 22.3333C1.33333 15.6667 5.06667 9 11.7333 9V5.66667L20.0667 10.6667L11.7333 15.6667Z"></path></svg>
                            <span class="text-sm font-semibold">Chia sẻ</span>
                        </button>
                    </div>
                </div>

                <div class="bg-[#272727] p-3 rounded-xl text-sm mb-4">
                    <p id="watch-description" class="whitespace-pre-line line-clamp-2">Đang tải mô tả...</p>
                    <button id="show-more-btn" class="font-bold mt-2 text-white hidden-view">Hiện thêm</button>
                </div>
            </div>
        </div>

        <!-- Cột Phải: Video đề xuất -->
        <div class="w-full lg:w-[30%] p-4">
            <h2 class="text-lg font-bold mb-4">Video liên quan</h2>
            <div id="related-videos" class="flex flex-col space-y-3">
                <!-- Video liên quan render bằng JS -->
            </div>
        </div>
    </main>

    <script>
        // Các biến toàn cục
        var API_KEY = localStorage.getItem('yt_api_key') || '';
        var player = null;
        var currentVideoId = null;

        // Các thành phần DOM
        var apiModal = document.getElementById('api-modal');
        var apiKeyInput = document.getElementById('api-key-input');
        var saveApiBtn = document.getElementById('save-api-btn');
        var closeModalBtn = document.getElementById('close-modal-btn');
        var settingsBtn = document.getElementById('settings-btn');
        
        var homeView = document.getElementById('home-view');
        var watchView = document.getElementById('watch-view');
        var videoGrid = document.getElementById('video-grid');
        var relatedVideos = document.getElementById('related-videos');
        var statusMessage = document.getElementById('status-message');
        
        var logoBtn = document.getElementById('logo-btn');
        var searchInput = document.getElementById('search-input');
        var searchBtn = document.getElementById('search-btn');

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            // Không khởi tạo videoId ngay từ đầu để tránh lỗi load
            player = new YT.Player('youtube-player', {
                playerVars: {
                    'playsinline': 1,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1
                }
            });
        }

        function showApiModal() {
            apiModal.classList.remove('hidden-view');
            apiKeyInput.value = API_KEY;
            if (API_KEY) {
                closeModalBtn.classList.remove('hidden-view');
            } else {
                closeModalBtn.classList.add('hidden-view');
            }
        }

        function hideApiModal() {
            apiModal.classList.add('hidden-view');
        }

        saveApiBtn.addEventListener('click', function() {
            var val = apiKeyInput.value.trim();
            if (val) {
                API_KEY = val;
                localStorage.setItem('yt_api_key', API_KEY);
                hideApiModal();
                loadHomeFeed();
            } else {
                alert("Vui lòng nhập API Key hợp lệ!");
            }
        });

        closeModalBtn.addEventListener('click', hideApiModal);
        settingsBtn.addEventListener('click', showApiModal);

        function fetchAPI(endpoint, params) {
            if (!API_KEY) return Promise.reject("Thiếu API Key");
            
            var url = 'https://www.googleapis.com/youtube/v3/' + endpoint + '?key=' + API_KEY;
            for (var key in params) {
                url += '&' + key + '=' + encodeURIComponent(params[key]);
            }

            return fetch(url).then(function(response) {
                if (!response.ok) {
                    throw new Error('Lỗi API: ' + response.statusText);
                }
                return response.json();
            });
        }

        // Tiện ích format số
        function formatNumber(num) {
            if (!num) return '0';
            var n = parseInt(num);
            if (n >= 1000000) return (n / 1000000).toFixed(1) + ' Tr';
            if (n >= 1000) return (n / 1000).toFixed(1) + ' N';
            return n.toString();
        }

        function timeSince(dateString) {
            var date = new Date(dateString);
            var seconds = Math.floor((new Date() - date) / 1000);
            var interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " năm trước";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " tháng trước";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " ngày trước";
            return "Gần đây";
        }

        function renderVideoGrid(items, isSearch) {
            videoGrid.innerHTML = '';
            
            if (!items || items.length === 0) {
                statusMessage.textContent = 'Không tìm thấy video nào.';
                statusMessage.classList.remove('hidden-view');
                return;
            }

            items.forEach(function(item) {
                // Phân biệt dữ liệu từ search API và videos API
                var videoId = isSearch ? item.id.videoId : item.id;
                if (!videoId) return;

                var snippet = item.snippet;
                var channelTitle = snippet.channelTitle;
                var title = snippet.title;
                var publishedAt = timeSince(snippet.publishedAt);
                var viewsText = item.statistics ? formatNumber(item.statistics.viewCount) + ' lượt xem • ' : '';
                
                var thumbnailUrl = snippet.thumbnails.medium ? snippet.thumbnails.medium.url : (snippet.thumbnails.default ? snippet.thumbnails.default.url : '');

                var el = document.createElement('div');
                el.className = 'yt-grid-item';
                el.innerHTML = `
                    <div class="flex flex-col cursor-pointer group" onclick="playVideo('${videoId}')">
                        <div class="aspect-16-9-img rounded-xl mb-3">
                            <img src="${thumbnailUrl}" alt="Thumbnail">
                        </div>
                        <div class="flex space-x-3">
                            <div class="w-9 h-9 rounded-full bg-gray-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold uppercase mt-1">
                                ${channelTitle.charAt(0)}
                            </div>
                            <div class="flex flex-col overflow-hidden">
                                <h3 class="text-sm font-semibold text-white line-clamp-2 group-hover:text-blue-400">${title}</h3>
                                <div class="text-xs text-[#aaaaaa] mt-1">${channelTitle}</div>
                                <div class="text-xs text-[#aaaaaa]">${viewsText}${publishedAt}</div>
                            </div>
                        </div>
                    </div>
                `;
                videoGrid.appendChild(el);
            });
        }

        function showHome() {
            homeView.classList.remove('hidden-view');
            watchView.classList.add('hidden-view');
            if (player && player.pauseVideo) {
                player.pauseVideo();
            }
        }

        function loadHomeFeed() {
            showHome();
            statusMessage.textContent = 'Đang tải video phổ biến...';
            statusMessage.classList.remove('hidden-view');
            videoGrid.innerHTML = '';

            fetchAPI('videos', {
                part: 'snippet,statistics',
                chart: 'mostPopular',
                regionCode: 'VN',
                maxResults: 24
            }).then(function(data) {
                statusMessage.classList.add('hidden-view');
                renderVideoGrid(data.items, false);
            }).catch(function(err) {
                statusMessage.textContent = 'Lỗi tải dữ liệu. Hãy kiểm tra API Key của bạn.';
            });
        }

        function executeSearch() {
            var query = searchInput.value.trim();
            if (!query) return;

            showHome();
            statusMessage.textContent = 'Đang tìm kiếm...';
            statusMessage.classList.remove('hidden-view');
            videoGrid.innerHTML = '';

            fetchAPI('search', {
                part: 'snippet',
                q: query,
                type: 'video',
                maxResults: 20
            }).then(function(data) {
                statusMessage.classList.add('hidden-view');
                renderVideoGrid(data.items, true);
            }).catch(function(err) {
                statusMessage.textContent = 'Lỗi tìm kiếm.';
            });
        }

        searchBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') executeSearch();
        });

        logoBtn.addEventListener('click', loadHomeFeed);

        function playVideo(videoId) {
            currentVideoId = videoId;
            homeView.classList.add('hidden-view');
            watchView.classList.remove('hidden-view');
            
            // Cuộn lên đầu trang an toàn
            window.scrollTo(0, 0);

            if (player && player.loadVideoById) {
                player.loadVideoById(videoId);
            } else {
                // Khởi tạo Iframe nếu player chưa sẵn sàng
                var p = document.getElementById('youtube-player');
                p.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&playsinline=1';
            }

            // Tải thông tin video
            document.getElementById('watch-title').textContent = 'Đang tải...';
            
            fetchAPI('videos', {
                part: 'snippet,statistics',
                id: videoId
            }).then(function(data) {
                if (data.items && data.items.length > 0) {
                    var item = data.items[0];
                    var snippet = item.snippet;
                    var stats = item.statistics;

                    document.getElementById('watch-title').textContent = snippet.title;
                    document.getElementById('watch-stats').textContent = formatNumber(stats.viewCount) + ' lượt xem • ' + new Date(snippet.publishedAt).toLocaleDateString('vi-VN');
                    document.getElementById('watch-channel-name').textContent = snippet.channelTitle;
                    document.getElementById('watch-channel-avatar').textContent = snippet.channelTitle.charAt(0).toUpperCase();
                    document.getElementById('watch-likes').textContent = formatNumber(stats.likeCount);
                    
                    var descEl = document.getElementById('watch-description');
                    descEl.textContent = snippet.description;
                    descEl.classList.add('line-clamp-2');
                    
                    var showMore = document.getElementById('show-more-btn');
                    showMore.classList.remove('hidden-view');
                    showMore.onclick = function() {
                        if (descEl.classList.contains('line-clamp-2')) {
                            descEl.classList.remove('line-clamp-2');
                            showMore.textContent = 'Ẩn bớt';
                        } else {
                            descEl.classList.add('line-clamp-2');
                            showMore.textContent = 'Hiện thêm';
                        }
                    };

                    loadRelatedVideos(videoId);
                }
            });
        }

        function loadRelatedVideos(videoId) {
            relatedVideos.innerHTML = '<p class="text-sm text-gray-500">Đang tải video liên quan...</p>';
            
            // Lấy video theo chủ đề liên quan (Dùng search API do Youtube v3 bỏ relatedToVideoId cho key thường)
            fetchAPI('search', {
                part: 'snippet',
                q: document.getElementById('watch-channel-name').textContent, // Lấy video cùng kênh làm liên quan
                type: 'video',
                maxResults: 10
            }).then(function(data) {
                relatedVideos.innerHTML = '';
                if (data.items) {
                    data.items.forEach(function(item) {
                        var id = item.id.videoId;
                        if (id === videoId || !id) return;
                        
                        var snippet = item.snippet;
                        var thumbnailUrl = snippet.thumbnails.medium ? snippet.thumbnails.medium.url : '';
                        
                        var el = document.createElement('div');
                        el.className = 'flex flex-row space-x-3 items-start cursor-pointer group';
                        el.onclick = function() { playVideo(id); };
                        el.innerHTML = 
                            '<div class="w-[140px] min-w-[140px] bg-gray-700 rounded-lg overflow-hidden relative">' +
                                '<div class="aspect-16-9-img">' +
                                    '<img src="' + thumbnailUrl + '" alt="">' +
                                '</div>' +
                            '</div>' +
                            '<div class="flex flex-col">' +
                                '<h3 class="text-sm font-semibold text-white line-clamp-2 group-hover:text-blue-400 mb-1">' + snippet.title + '</h3>' +
                                '<p class="text-xs text-\[\#aaaaaa\]">' + snippet.channelTitle + '</p>' +
                                '<p class="text-xs text-\[\#aaaaaa\]">' + timeSince(snippet.publishedAt) + '</p>' +
                            '</div>';
                        relatedVideos.appendChild(el);
                    });
                }
            });
        }

        window.onload = function() {
            if (!API_KEY) {
                showApiModal();
            } else {
                loadHomeFeed();
            }
        };
    </script>
</body>
</html>
